<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AutoParts Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #e94560);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand h2 {
            color: #1a1a2e;
            font-weight: 800;
        }
        .brand p {
            color: #888;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #eee;
            font-size: 15px;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: none;
        }
        .btn-signup {
            background: linear-gradient(135deg, #e94560, #c73652);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .btn-signup:hover {
            transform: translateY(-2px);
            color: white;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #888;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #eee;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }
        .login-link a {
            color: #e94560;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .error-box {
            background: #fff0f0;
            border: 1px solid #ffcccc;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .error-box p {
            color: #e94560;
            margin: 0;
            font-size: 14px;
        }
        ul {
            padding-left: 0;
            list-style: none;
        }
        li {
            font-size: 13px;
            color: #888;
        }
        /* Fix Django form styling */
        p {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="signup-card">

        <!-- Brand -->
        <div class="brand">
            <h2> AutoParts Store</h2>
            <p>Create your account to start shopping</p>
        </div>

        <!-- Error Messages -->
        {% if form.errors %}
        <div class="error-box">
            {% for field in form %}
                {% for error in field.errors %}
                    <p> {{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
        {% endif %}

        <!-- Signup Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label> Username</label>
                <input type="text" name="username" class="form-control"
                       placeholder="Choose a username" required>
            </div>

            <div class="mb-3">
                <label> Password</label>
                <input type="password" name="password1" class="form-control"
                       placeholder="Create a password" required>
                <small class="text-muted">Min 8 characters, not too common</small>
            </div>

            <div class="mb-3">
                <label> Confirm Password</label>
                <input type="password" name="password2" class="form-control"
                       placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="btn-signup">
                Create Account 
            </button>
        </form>

        <div class="divider">or</div>

        <div class="login-link">
            Already have an account?
            <a href="/users/login/">Login here</a>
        </div>

    </div>

</body>
</html>
